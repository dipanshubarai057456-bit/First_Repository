<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Employee Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="EmployeeLogin.css">
</head>
<body class="Employee-Page">

    <h1 class="heading">EMPLOYEE LOG IN</h1>

    <div class="login-box">
        <form action="#" method="post">

            <label for="name">NAME:</label>
            <input type="text" id="name" placeholder="Enter Your Name" required>

            <label for="password">PASSWORD:</label>
            <input type="password" id="password" placeholder="Password" required>

            <div class="btn-box">
                <a href="Employee_Dashboard.html" onclick="StartDashboard()">Login</a>
                <a href="index.html" type="reset" class="cancle">Cancel</a>
            </div>
        </form>
    </div>

    <script type="text/javascript">
        function StartDashboard(){
            alert("Login Successful! Redirecting you to your dashboard…")
        }

    </script>

</body>
</html>
